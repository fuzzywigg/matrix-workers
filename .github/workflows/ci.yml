name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # Fail-fast canary for media + presence/receipts/typing soft∥success
  # concurrent leftovers (first wave #301 + residual second/third waves).
  # Isolates flake attribution before the full vitest suite.
  media-presence-soft-concurrent:
    name: Media/Presence Soft Concurrent Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:media-presence-soft-concurrent

  # Focused gate for crypto + database residual coverage (fast signal vs full suite).
  crypto-db:
    name: Crypto + DB residual tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:crypto-db

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  worker-bundle:
    name: Worker Bundle (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Validates the Worker compiles with wrangler/workers-types after deps bumps
      # without uploading (no Cloudflare credentials required).
      - run: npm run worker:check

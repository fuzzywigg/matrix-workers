name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # Fail-fast canary for media + presence/receipts/typing soft∥success
  # concurrent leftovers (first wave #301 + residual second/third/fourth/fifth/sixth waves).
  # Isolates flake attribution before the full vitest suite.
  media-presence-soft-concurrent:
    name: Media/Presence Soft Concurrent Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:media-presence-soft-concurrent

  # Focused gate for crypto + database residual coverage (fast signal vs full suite).
  crypto-db:
    name: Crypto + DB residual tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:crypto-db

  # Fail-fast canary for filters + appservice + auth concurrent leftovers
  # (septenary #304 + octonary #312 + nonary #319 + denary deepen). Isolates flake
  # attribution before the full vitest suite.
  filters-appservice-auth:
    name: Filters/Appservice/Auth Concurrent Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:filters-appservice-auth


  # Fail-fast canary for admin + federation concurrent leftovers
  # (quinary #317 + senary #328 + octonary #342 + denary deepen complementary to #351).
  # Isolates flake attribution before the full vitest suite.
  admin-federation:
    name: Admin/Federation Concurrent Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:admin-federation

  # Fail-fast canary for turn concurrent-race leftovers
  # (first-wave #299 + second-wave #313 + third-wave deepen). Isolates
  # flake attribution before the full vitest suite.
  turn-concurrent:
    name: Turn Concurrent Race Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:turn-concurrent

  # Fail-fast canary for oauth + devices/keys soft concurrent leftovers
  # (denary/undecenary/duodenary oauth + seventh/eighth/ninth-wave devices).
  # Isolates flake attribution before the full vitest suite.
  oauth-devices:
    name: OAuth/Devices Concurrent Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:oauth-devices

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  worker-bundle:
    name: Worker Bundle (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Validates the Worker compiles with wrangler/workers-types after deps bumps
      # without uploading (no Cloudflare credentials required).
      - run: npm run worker:check
